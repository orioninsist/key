name: orioninsist-production

services:
  png-renderer:
    image: orioninsist/png-renderer:local
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./output:/app/output:Z
    command:
      - content/work-smarter.json
      - instagram_story
      - --format
      - png
    restart: "no"
