name: orioninsist-rss
services:
  freshrss:
    image: freshrss/freshrss:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRESHRSS_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      CRON_MIN: '7,37'
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  freshrss_data:
  freshrss_extensions:
